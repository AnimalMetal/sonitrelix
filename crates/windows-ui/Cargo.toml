[package]
name = "sonitrelix-windows-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Sonitrelix"
path = "src/main.rs"

[dependencies]
sonitrelix-session.workspace = true
serde.workspace = true
serde_json.workspace = true
sonitrelix-settings = { path = "../settings" }
sonitrelix-devices = { path = "../devices" }
sonitrelix-audio-io = {path="../audio-io"}
sonitrelix-engine = {path="../engine"}
sonitrelix-editing = {path="../editing"}
sonitrelix-effects = {path="../effects"}
sonitrelix-mixer = {path="../mixer"}
sonitrelix-updater = {path="../updater"}

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-core = "0.62.2"

