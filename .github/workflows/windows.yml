name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check bilingual user guide
        run: python tools/build_user_guide.py --check
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq sonitrelix-windows-ui).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match Cargo workspace version.' }
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test without audio hardware
        run: cargo test --workspace --locked
      - name: Build Windows executable
        run: |
          $library = Get-ChildItem target/debug/build/openssl-sys-*/out/openssl-build/install/lib/libcrypto.lib | Select-Object -First 1
          if (-not $library) { throw 'Static OpenSSL was not built during validation.' }
          $env:OPENSSL_DIR = $library.Directory.Parent.FullName
          $env:OPENSSL_STATIC = '1'
          $env:OPENSSL_NO_VENDOR = '1'
          cargo build --release --workspace --locked
      - name: Prepare portable development build
        run: |
          ./tools/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Sonitrelix-windows-x64
          path: |
            dist/Sonitrelix-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
